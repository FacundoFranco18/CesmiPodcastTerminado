<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio de Podcast Virtual - Live Show</title>
    <link rel="icon" type="image/png" href="ICONOFIN-removebg-preview.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="theme-purple">

    <!-- CIELO DINÁMICO (DÍA / NOCHE) -->
    <div id="skyBackground" class="sky-bg">
        <div class="stars-container"></div>
        <div class="moon"></div>
        <div class="sun"></div>
        <div class="clouds-container"></div>
    </div>

    <div id="emojiContainer"></div>

    <div class="app-container">
        <header class="header">
            <div class="brand">
                <i class="fas fa-podcast logo-icon"></i>
                <h1>PODCAST<span>CESMI</span> <span class="badge-live"><i class="fas fa-circle"></i> EN VIVO</span></h1>
            </div>

            <div class="header-center-logo">
                <button class="secret-logo-btn" id="btnSecretLogo" title="¿Qué pasa si me apretás? (L)">
                    <img src="ICONOFIN-removebg-preview.png" alt="Logo CESMI" class="center-logo-img">
                </button>
            </div>

            <div class="live-meta">
                <span class="meta-item" id="metaClock" title="Hora local"><i class="far fa-clock"></i> <b>--:--:--</b></span>
                <span class="meta-item" id="metaUptime" title="Tiempo al aire"><i class="fas fa-tower-broadcast"></i> <b>00:00:00</b></span>
                <span class="meta-item" id="metaViewers" title="Espectadores en vivo"><i class="fas fa-eye"></i> <b>0</b></span>
            </div>

            <div class="lighting-controls">
                <span class="label">Perfiles / Tema:</span>

                <button class="party-btn" id="btnToggleTheme" title="Cambiar Día / Noche" style="background: rgba(255,255,255,0.1); border: 1px solid var(--panel-border);">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>

                <button class="color-btn purple active" data-color="purple" title="Facundo (Shift+Q)">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Facundo" class="user-avatar">
                </button>
                <button class="color-btn cyan" data-color="cyan" title="Integrante 2 (Shift+W)">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=80" alt="Integrante 2" class="user-avatar">
                </button>
                <button class="color-btn emerald" data-color="emerald" title="Integrante 3 (Shift+E)">
                    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=100&q=80" alt="Integrante 3" class="user-avatar">
                </button>
                <button class="color-btn amber" data-color="amber" title="Integrante 4 (Shift+R)">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" alt="Integrante 4" class="user-avatar">
                </button>
                <button class="color-btn pink" data-color="pink" title="Integrante 5 (Shift+T)">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=100&q=80" alt="Integrante 5" class="user-avatar">
                </button>
                <button class="party-btn" id="btnPartyMode" title="Modo Fiesta RGB / Explosión (Shift+P)">
                    <i class="fas fa-bolt"></i>
                </button>
            </div>
        </header>

        <main class="main-content">
            <section class="stage cols-3">
                <div class="cam-frame" id="frameHost">
                    <div class="video-container">
                        <video id="videoHost" class="cam-video" autoplay loop muted playsinline>
                            <source src="https://assets.mixkit.co/videos/preview/mixkit-man-holding-a-microphone-talking-41582-large.mp4" type="video/mp4">
                        </video>
                        <div class="cam-overlay">
                            <span class="host-tag"><i class="fas fa-crown"></i> CONDUCTOR PRINCIPAL</span>
                        </div>
                    </div>
                    <div class="mic-status active speaking" id="statusHost">
                        <i class="fas fa-microphone"></i>
                    </div>
                    <div class="frame-controls">
                        <button class="mic-toggle-btn" id="btnMicHost">
                            <i class="fas fa-microphone-slash"></i> Mutear (M)
                        </button>
                    </div>
                </div>

                <div class="cam-frame" id="frameGuest">
                    <div class="video-container">
                        <video id="videoGuest" class="cam-video" autoplay loop muted playsinline>
                            <source src="https://assets.mixkit.co/videos/preview/mixkit-woman-speaking-into-a-microphone-41584-large.mp4" type="video/mp4">
                        </video>
                        <div class="cam-overlay">
                            <span class="host-tag"><i class="fas fa-star"></i> INVITADO</span>
                        </div>
                    </div>
                    <div class="mic-status active" id="statusGuest">
                        <i class="fas fa-microphone"></i>
                    </div>
                    <div class="frame-controls">
                        <button class="mic-toggle-btn" id="btnMicGuest">
                            <i class="fas fa-microphone-slash"></i> Mutear (N)
                        </button>
                    </div>
                </div>

                <div class="cam-frame satisfy-frame" id="frameSatisfying">
                    <div class="video-container">
                        <video id="videoSatisfying" class="cam-video" autoplay loop muted playsinline>
                            <source src="https://assets.mixkit.co/videos/preview/mixkit-liquid-art-with-colorful-ink-41132-large.mp4" type="video/mp4">
                        </video>
                        <div class="cam-overlay">
                            <span class="host-tag satisfy-tag"><i class="fas fa-eye"></i> RETENCIÓN / SATISFACTORIO</span>
                        </div>
                    </div>
                    <div class="frame-controls">
                        <button class="action-btn-sm" id="btnChangeVideo">
                            <i class="fas fa-random"></i> Cambiar Video (V)
                        </button>
                    </div>
                </div>
            </section>

            <aside class="sidebar">
                <div class="panel">
                    <h2><i class="fas fa-volume-up"></i> Soundboard FX</h2>
                    <div class="soundboard-grid">
                        <button class="fx-btn round" data-sound="applause" data-emoji="👏" title="Aplausos [1]">👏</button>
                        <button class="fx-btn round" data-sound="laughter" data-emoji="😂" title="Risas [2]">😂</button>
                        <button class="fx-btn round" data-sound="airhorn" data-emoji="🎺" title="Bocina [3]">🎺</button>
                        <button class="fx-btn round" data-sound="rimshot" data-emoji="🥁" title="Ba-Dum-Tss [4]">🥁</button>
                        <button class="fx-btn round" data-sound="fail" data-emoji="❌" title="Fail [5]">❌</button>
                        <button class="fx-btn round" data-sound="crickets" data-emoji="🦗" title="Grillos [6]">🦗</button>
                    </div>
                </div>

                <div class="panel panel-row">
                    <h2><i class="fas fa-magic"></i> Efectos Visuales</h2>
                    <button class="round-action-btn" id="btnConfetti" title="Lanzar Confeti (Espacio)">🎉</button>
                </div>

                <div class="panel">
                    <h2>
                        <i class="fas fa-laugh-beam"></i> Teleprompter / Humor
                        <button class="joke-next-round" id="btnNextJoke" title="Siguiente Chiste (J)">
                            <i class="fas fa-forward"></i>
                        </button>
                    </h2>
                    <div class="joke-text" id="jokeBox">
                        "¿Qué le dice un bit al otro? Nos vemos en el bus."
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <div id="alertStack" aria-live="polite"></div>

    <div class="ticker" aria-hidden="true">
        <div class="ticker-track" id="tickerTrack"></div>
    </div>

    <script src="efectosEspeciales.js"></script>
    <script src="extrasEnVivo.js"></script>
    <script type="module">
        // Pretext: medición de texto sin reflow → teleprompter que siempre entra y no salta
        // https://github.com/chenglou/pretext
        const jokeBox = document.getElementById('jokeBox');
        const MAX_LINES = 3;
        const MIN_SIZE = 12;
        const MAX_SIZE = 17;
        const LINE_HEIGHT = 1.55;
        const LETTER_SPACING = 0.2;

        let pretext = null;
        try {
            pretext = await import('https://esm.sh/@chenglou/pretext');
        } catch (err) {
            console.warn('Pretext no disponible, se usa fallback DOM:', err);
        }

        function contentWidth() {
            const cs = getComputedStyle(jokeBox);
            const padX =
                parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) +
                parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
            return jokeBox.clientWidth - padX;
        }

        function restartFade() {
            jokeBox.style.animation = 'none';
            void jokeBox.offsetWidth;
            jokeBox.style.animation = '';
        }

        function fitWithPretext(text) {
            const width = contentWidth();
            const padY =
                parseFloat(getComputedStyle(jokeBox).paddingTop) +
                parseFloat(getComputedStyle(jokeBox).paddingBottom);

            let chosen = null;
            for (let size = MAX_SIZE; size >= MIN_SIZE; size--) {
                const lineHeight = Math.round(size * LINE_HEIGHT * 10) / 10;
                const prepared = pretext.prepare(text, `500 ${size}px "Segoe UI"`, {
                    letterSpacing: LETTER_SPACING
                });
                const { lineCount, height } = pretext.layout(prepared, width, lineHeight);
                chosen = { size, height, lineCount };
                if (lineCount <= MAX_LINES) break;
            }

            jokeBox.style.fontSize = `${chosen.size}px`;
            jokeBox.style.minHeight = `${Math.max(72, Math.ceil(chosen.height + padY))}px`;
        }

        let typeTimer = null;

        window.renderTeleprompter = (text) => {
            clearInterval(typeTimer);
            jokeBox.textContent = text;
            if (pretext) {
                try {
                    fitWithPretext(text);
                } catch (err) {
                    console.warn('Pretext fit falló:', err);
                }
            }
            // Efecto máquina de escribir (la altura ya está fijada por Pretext → no salta)
            let i = 0;
            jokeBox.textContent = '';
            typeTimer = setInterval(() => {
                i++;
                jokeBox.textContent = text.slice(0, i);
                if (i >= text.length) clearInterval(typeTimer);
            }, 16);
        };

        // Ajustar el chiste inicial cuando las fuentes estén listas
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => window.renderTeleprompter(jokeBox.textContent.trim()));
        } else {
            window.renderTeleprompter(jokeBox.textContent.trim());
        }
    </script>
</body>
</html>
